spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/complaint_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:arun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

# JWT Secret Key (Change this in production)
app.jwtSecret=SecretKeyToGenJWTsThisShouldBeLongAndSecureEnoughToNotBeGuessedEasily
app.jwtExpirationMs=86400000

# CORS Allowed Origins (comma-separated, no spaces)
# Update the Vercel URL to match your actual deployment
app.cors.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}
